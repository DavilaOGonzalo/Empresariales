{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Biblioteca{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <div>
                <p class="eyebrow">Django</p>
                <h1>Biblioteca empresarial</h1>
            </div>
            <nav class="header-actions">
                <a class="header-link" href="{% url 'lista_libros' %}">Libros</a>
                <a class="header-link" href="{% url 'lista_prestamos' %}">Préstamos</a>
                <a class="header-link" href="{% url 'reportes' %}">Reportes</a>
            </nav>
        </div>
    </header>

    <main class="container page-content">
        {% block content %}
        {% endblock %}
    </main>

    <script src="{% static 'core/js/app.js' %}" defer></script>
</body>
</html>
